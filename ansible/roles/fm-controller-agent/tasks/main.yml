---
- name: Build Docker image
  ansible.builtin.include_tasks: build.yml
  when: build_enabled

- name: Set image name
  ansible.builtin.set_fact:
    _fm_controller_agent_full_image: >-
      {{ (image_registry ~ '/' if image_registry else '')
      ~ fm_controller_agent_image_name }}

- name: Install fm-controller-agent
  ansible.builtin.command: >
    helm upgrade --install fm-controller-agent
    {{ fm_controller_agent_chart }}
    --namespace {{ forgemaster_namespace }}
    --create-namespace
    --set crd.enabled={{ fm_controller_agent_crd_enabled }}
    --set controller.enabled={{ fm_controller_agent_controller_enabled }}
    --set controller.image.repository={{ _fm_controller_agent_full_image }}
    --set controller.image.tag={{ image_tag }}
    --set controller.image.pullPolicy={{ image_pull_policy }}
    --set runtime-agent.model={{ default_model }}
    --set runtime-agent.llm-provider.secretName={{ llm_provider_secret_name }}
    --set runtime-agent.llm-provider.secretKey={{ llm_provider_secret_key }}
  changed_when: false

- name: Wait for Agent CRD
  ansible.builtin.command: >
    kubectl wait --for=condition=Established
    crd/agents.forgemaster.io
    --timeout=60s
  changed_when: false
  when: fm_controller_agent_crd_enabled

- name: Wait for controller deployment
  ansible.builtin.command: >
    kubectl rollout status deployment/fm-controller-agent
    --namespace {{ forgemaster_namespace }}
    --timeout=120s
  changed_when: false
  when: fm_controller_agent_controller_enabled
