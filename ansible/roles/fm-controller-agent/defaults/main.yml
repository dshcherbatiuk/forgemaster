---
forgemaster_namespace: forgemaster-system
fm_controller_agent_chart: "{{ playbook_dir }}/../crates/fm-controller-agent/helm"
fm_controller_agent_crd_enabled: true
fm_controller_agent_controller_enabled: false

# Docker image settings
fm_controller_agent_image_registry: ""
fm_controller_agent_image_name: fm-controller-agent
fm_controller_agent_image_tag: "{{ lookup('env', 'VERSION') | default('latest', true) }}"
fm_controller_agent_image_pull_policy: Never  # Use local image (OrbStack)

# Build settings
fm_controller_agent_build_enabled: false
fm_controller_agent_dockerfile: "{{ playbook_dir }}/../crates/fm-controller-agent/Dockerfile"
fm_controller_agent_build_context: "{{ playbook_dir }}/.."
