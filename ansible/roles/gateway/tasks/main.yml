---
- name: Install Gateway API CRDs
  ansible.builtin.command: >
    kubectl apply -f
    https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  register: gateway_crd_install
  changed_when: "'created' in gateway_crd_install.stdout"

- name: Install Envoy Gateway
  ansible.builtin.command: >
    helm upgrade --install envoy-gateway oci://docker.io/envoyproxy/gateway-helm
    --version {{ envoy_gateway_version }}
    --namespace envoy-gateway-system
    --create-namespace
  changed_when: false

- name: Wait for Envoy Gateway
  ansible.builtin.command: >
    kubectl wait --for=condition=Available deployment/envoy-gateway
    -n envoy-gateway-system --timeout=120s
  changed_when: false

- name: Create GatewayClass
  ansible.builtin.command: kubectl apply -f {{ role_path }}/files/gatewayclass.yaml
  register: gatewayclass_create
  changed_when: "'created' in gatewayclass_create.stdout"

- name: Display Gateway info
  ansible.builtin.debug:
    msg: "Envoy Gateway installed"
