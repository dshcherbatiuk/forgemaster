---
- name: Build Docker image
  ansible.builtin.shell: |
    docker build \
      --progress=plain \
      -f {{ fm_controller_agenttask_dockerfile }} \
      -t {{ fm_controller_agenttask_image_name }}:{{ fm_controller_agenttask_image_tag }} \
      {{ fm_controller_agenttask_build_context }} 2>&1
  args:
    executable: /bin/bash
  register: build_output
  changed_when: true

- name: Show build output
  ansible.builtin.debug:
    var: build_output.stdout_lines

- name: Tag and push image to registry
  when: fm_controller_agenttask_image_registry | length > 0
  block:
    - name: Tag image for registry
      ansible.builtin.command: >
        docker tag
        {{ fm_controller_agenttask_image_name }}:{{ fm_controller_agenttask_image_tag }}
        {{ fm_controller_agenttask_image_registry }}/{{ fm_controller_agenttask_image_name }}:{{ fm_controller_agenttask_image_tag }}
      changed_when: true

    - name: Push image to registry
      ansible.builtin.command: >
        docker push
        {{ fm_controller_agenttask_image_registry }}/{{ fm_controller_agenttask_image_name }}:{{ fm_controller_agenttask_image_tag }}
      changed_when: true
