{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fm-controller-agent
  labels:
    app.kubernetes.io/name: fm-controller-agent
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: forgemaster
rules:
  - apiGroups:
      - forgemaster.io
    resources:
      - agents
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - forgemaster.io
    resources:
      - agents/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - forgemaster.io
    resources:
      - agenttasks
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fm-controller-agent
  labels:
    app.kubernetes.io/name: fm-controller-agent
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: forgemaster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fm-controller-agent
subjects:
  - kind: ServiceAccount
    name: fm-controller-agent
    namespace: {{ .Values.namespace }}
---
# ClusterRole for agent runtime pods — allows patching Agent CR status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fm-agent-runtime-claude
  labels:
    app.kubernetes.io/name: fm-agent-runtime-claude
    app.kubernetes.io/component: agent-runtime
    app.kubernetes.io/part-of: forgemaster
rules:
  - apiGroups:
      - forgemaster.io
    resources:
      - agents/status
    verbs:
      - get
      - update
      - patch
{{- end }}
