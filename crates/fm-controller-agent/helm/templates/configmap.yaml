{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fm-controller-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: fm-controller-agent
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: forgemaster
data:
  RUST_LOG: "info"
  RUNTIME_AGENT_IMAGE: "{{ index .Values "runtime-agent" "image" "repository" }}:{{ index .Values "runtime-agent" "image" "tag" }}"
  LLM_PROVIDER_SECRET_NAME: "{{ index .Values "runtime-agent" "llm-provider" "secretName" }}"
  LLM_PROVIDER_SECRET_KEY: "{{ index .Values "runtime-agent" "llm-provider" "secretKey" }}"
  LLM_PROVIDER_DEFAULT_MODEL: "{{ index .Values "runtime-agent" "model" }}"
  DEFAULT_MAX_TOKENS: "{{ index .Values "runtime-agent" "maxTokens" }}"
  {{- if .Values.controller.defaultMcpServers }}
  DEFAULT_MCP_SERVERS: "{{ .Values.controller.defaultMcpServers }}"
  {{- end }}
  {{- if .Values.controller.workspace }}
  WORKSPACE_BASE_PATH: "{{ .Values.controller.workspace.basePath }}"
  WORKSPACE_CONTAINER_PATH: "{{ .Values.controller.workspace.containerPath }}"
  {{- end }}
  {{- if .Values.controller.dockerSocket }}
  DOCKER_SOCKET_ENABLED: "{{ .Values.controller.dockerSocket.enabled }}"
  DOCKER_SOCKET_PATH: "{{ .Values.controller.dockerSocket.path }}"
  {{- end }}
{{- end }}
