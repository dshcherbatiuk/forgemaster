{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fm-controller-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: fm-controller-agent
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: forgemaster
data:
  RUST_LOG: "info"
  RUNTIME_AGENT_IMAGE: "{{ index .Values "runtime-agent" "image" "repository" }}:{{ index .Values "runtime-agent" "image" "tag" }}"
  LLM_PROVIDER_SECRET_NAME: "{{ index .Values "runtime-agent" "llm-provider" "secretName" }}"
  LLM_PROVIDER_SECRET_KEY: "{{ index .Values "runtime-agent" "llm-provider" "secretKey" }}"
{{- end }}
