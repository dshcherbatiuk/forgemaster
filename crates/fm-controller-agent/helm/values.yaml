crd:
  enabled: true

controller:
  enabled: false
  replicas: 1
  image:
    repository: fm-controller-agent
    tag: latest
    pullPolicy: IfNotPresent
  # Default MCP servers for agents (comma-separated name:port, port defaults to 3000)
  defaultMcpServers: "fm-controller-agent-mcp"
  # MCP server exposed by this controller
  mcp:
    port: 3000
  # Workspace directory for agent task output (hostPath mount)
  workspace:
    basePath: ""  # Set via Ansible (resolved to absolute path at deploy time)
    containerPath: "/workspace"
  # Docker socket mount for agent pods (enables docker_build in fm-mcp-devtools)
  dockerSocket:
    enabled: false
    path: /var/run/docker.sock
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "128Mi"
      cpu: "100m"

runtime-agent:
  image:
    repository: fm-agent-runtime-claude
    tag: latest
  model: claude-sonnet-4-20250514
  llm-provider:
    secretName: anthropic-credentials
    secretKey: api-key

namespace: forgemaster-system
