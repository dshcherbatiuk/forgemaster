crd:
  enabled: true

controller:
  enabled: false
  replicas: 1
  image:
    repository: fm-controller-agent
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "128Mi"
      cpu: "100m"

namespace: forgemaster-system
