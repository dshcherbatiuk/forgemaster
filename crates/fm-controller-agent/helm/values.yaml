crd:
  enabled: true

controller:
  enabled: false
  replicas: 1
  image:
    repository: fm-controller-agent
    tag: latest
    pullPolicy: IfNotPresent
  # Default MCP servers for agents (comma-separated name:port, port defaults to 3000)
  defaultMcpServers: "fm-controller-agent"
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "128Mi"
      cpu: "100m"

runtime-agent:
  image:
    repository: fm-agent-runtime-claude
    tag: latest
  model: claude-sonnet-4-20250514
  llm-provider:
    secretName: anthropic-credentials
    secretKey: api-key

namespace: forgemaster-system
