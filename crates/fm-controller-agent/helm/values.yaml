crd:
  enabled: true

controller:
  enabled: false
  replicas: 1
  image:
    repository: fm-controller-agent
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "128Mi"
      cpu: "100m"

runtime-agent:
  image:
    repository: fm-agent-runtime
    tag: latest
  llm-provider:
    secretName: anthropic-credentials
    secretKey: api-key

namespace: forgemaster-system
