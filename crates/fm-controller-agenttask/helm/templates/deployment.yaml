{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fm-controller-agenttask
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: fm-controller-agenttask
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: forgemaster
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fm-controller-agenttask
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fm-controller-agenttask
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: forgemaster
    spec:
      serviceAccountName: fm-controller-agenttask
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          ports:
            - name: ws
              containerPort: {{ .Values.controller.ws.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fm-controller-agenttask
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
{{- end }}
