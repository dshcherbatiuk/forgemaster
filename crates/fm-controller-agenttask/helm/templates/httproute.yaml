{{- if .Values.controller.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fm-controller-agenttask
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: forgemaster-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: fm-controller-agenttask
          port: {{ .Values.controller.ws.port }}
{{- end }}
