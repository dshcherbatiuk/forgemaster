crd:
  enabled: true

controller:
  enabled: true
  replicas: 1
  image:
    repository: fm-controller-agenttask
    tag: latest
    pullPolicy: IfNotPresent
  ws:
    port: 8080
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "128Mi"
      cpu: "100m"

namespace: forgemaster-system
