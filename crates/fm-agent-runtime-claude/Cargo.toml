rmcp = { workspace = true }

a2a-rs-core = { workspace = true }
a2a-rs-server = { workspace = true }
a2a-rs-client = { workspace = true }

# SSE parsing (Claude streaming API)
eventsource-stream = "0.2"

[lints]
workspace = true
