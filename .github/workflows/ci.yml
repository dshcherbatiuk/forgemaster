name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: rust-cache
      - run: make all

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci
      - run: make ui

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [rust, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: fm-controller-agenttask
            context: .
            dockerfile: crates/fm-controller-agenttask/Dockerfile
          - image: fm-controller-agent
            context: .
            dockerfile: crates/fm-controller-agent/Dockerfile
          - image: fm-agent-runtime-claude
            context: .
            dockerfile: crates/fm-agent-runtime-claude/Dockerfile
          - image: fm-mcp-filesystem
            context: .
            dockerfile: crates/fm-mcp-filesystem/Dockerfile
          - image: fm-mcp-devtools
            context: .
            dockerfile: crates/fm-mcp-devtools/Dockerfile
          - image: forgemaster-ui
            context: ui
            dockerfile: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
