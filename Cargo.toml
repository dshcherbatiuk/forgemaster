[workspace]
resolver = "2"
members = [
    "crates/fm-core",
    "crates/fm-controller-agenttask",
    "crates/fm-controller-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["CSM-101 <dima.scherbatyuk@gmail.com>"]
license = "MIT"
repository = "https://github.com/forgemaster/forgemaster"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Builder pattern
typed-builder = "0.20"

# Async trait
async-trait = "0.1"

# Futures
futures = "0.3"

# Concurrent HashMap
dashmap = "6.1"

# SmallVec for avoiding heap allocations
smallvec = { version = "1.13", features = ["serde"] }

# Kubernetes
kube = { version = "0.98", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
schemars = "0.8"

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Internal crates
fm-core = { path = "crates/fm-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
